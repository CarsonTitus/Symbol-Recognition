# ---------------------------------------------------------------------------
# default.yaml: every setting the project uses, in one place.
# Stage files (stage_a.yaml, stage_b.yaml) start from this file and only list
# what they change ("base: default.yaml").
# YAML ("YAML Ain't Markup Language") is a plain-text settings format.
# ---------------------------------------------------------------------------

seed: 0                       # fixed random seed so runs are reproducible (CLAUDE.md §0.6)

paths:                        # all paths are relative to the repo root
  data_root: data
  raw_public: data/raw_public
  raw_own: data/raw_own
  processed: data/processed
  runs: runs
  results: results

# The three outputs from the submitted scope (CLAUDE.md §2-§3).
# ORDER MATTERS: index 0, 1, 2 are the model's output positions and the
# rows/columns of the reward matrix below.
classes:
  - no_symbol
  - unknown_symbol
  - triangle

# Reward matrix: rows = TRUE label, columns = PREDICTED label (same order as classes).
# Copied exactly from the submitted rubric (CLAUDE.md §2):
#   correct "no symbol" = 1.0, "detected but cannot identify" = 0.5,
#   "detected and identified" = 1.0, anything wrong = 0.0
# TEAM DECISION (open question §14.3): to count a correct unknown_symbol as +1,
# change ONLY the 0.5 in the middle row below and say so in the presentation.
reward_matrix:
  #  pred:  no_symbol  unknown_symbol  triangle
  - [1.0, 0.0, 0.0]   # true no_symbol
  - [0.0, 0.5, 0.0]   # true unknown_symbol
  - [0.0, 0.5, 1.0]   # true triangle

# Safety net (CLAUDE.md §3): if the model's top confidence is below this,
# report unknown_symbol instead of guessing. Results are reported with and without it.
confidence_threshold: 0.6

image:
  size: 224                   # images are padded to square, then resized to 224x224 RGB
  allow_flips: true           # mirror-flip augmentation; fine for triangles, off for asymmetric symbols

# How scripts/prepare_data.py splits images (CLAUDE.md §5c).
prepare:
  # Our own photos are split BY DRAWER: every photo by one person lands in one split only.
  own_split_shares: {train: 0.70, val: 0.15, test: 0.15}
  # Public data is never used for testing (test = our own photos only).
  public_val_share: 0.15      # 85% train / 15% validation
  workers: 8                  # parallel processes for resizing images (tower: up to ~40)

# Public datasets (CLAUDE.md §5a). scripts/download_public.py downloads them into
# paths.raw_public; scripts/prepare_data.py uses each class_map to sort their
# images into our three classes. A source class NOT listed in its class_map is skipped.
public_data:
  hds:                        # Hand-Drawn Shapes, CC BY 4.0, 70x70 drawings by 37 people
    git_url: https://github.com/frobertpixto/hand-drawn-shapes-dataset
    class_map:
      triangle: triangle
      rectangle: unknown_symbol
      ellipse: unknown_symbol
      other: unknown_symbol
  quickdraw:                  # Google Quick, Draw!, CC BY 4.0, 28x28 doodles (white on black)
    base_url: https://storage.googleapis.com/quickdraw_dataset/full/numpy_bitmap
    per_category_cap: 3000    # only the first 3000 drawings of each category are downloaded
    # Triangle-like categories (mountain, tent, pizza...) are deliberately NOT listed:
    # they would teach the model that triangles are "unknown". ("arrow" does not exist.)
    class_map:
      triangle: triangle
      circle: unknown_symbol
      square: unknown_symbol
      hexagon: unknown_symbol
      octagon: unknown_symbol
      star: unknown_symbol
      zigzag: unknown_symbol
      line: unknown_symbol
      lightning: unknown_symbol
      diamond: unknown_symbol
      smiley face: unknown_symbol
      squiggle: unknown_symbol
  hf_geometric_shapes:        # Hugging Face 0-ma/geometric-shapes, MIT license, 50x50 synthetic
    repo_id: 0-ma/geometric-shapes
    # Label names are "1".."6"; "1" means text on a colored background with NO shape.
    # Only that one is used (as a minority of no_symbol); its shapes are not hand-drawn.
    class_map:
      "1": no_symbol
  kaggle:                     # need a Kaggle API token (README); skipped if none is set up
    geometric_shapes_mathematics:
      slug: reevald/geometric-shapes-mathematics
      class_map: {}           # filled in after the team inspects samples (kite/trapezoid look triangle-ish)
    four_shapes:
      slug: smeschke/four-shapes
      class_map:
        triangle: triangle
        square: unknown_symbol
        circle: unknown_symbol
        star: unknown_symbol

model:
  name: mobilenetv3_large_100 # timm model name (phone-sized CNN, ~5.5M parameters)
  pretrained: true            # start from ImageNet weights (downloaded from Hugging Face)

data:
  fraction: 1.0               # share of training data to use (learning-curve runs use 0.1/0.25/0.5/1.0)
  num_workers: 8              # parallel image-loading processes; tower: 8-16, laptop: 2-4
  weighted_sampler: true      # sample rarer classes more often so classes are balanced

train:
  batch_size: 64              # lower to 32 if the GPU runs out of memory
  optimizer: adamw            # AdamW = Adam optimizer with decoupled weight decay
  weight_decay: 0.05
  label_smoothing: 0.1        # stops the model from becoming over-confident
  mixed_precision: true       # 16-bit math on GPU: ~2x faster, less memory
  early_stopping_patience: 5  # stop if validation reward has not improved for this many epochs
  frozen_epochs: 3            # phase 1: only the new final layer learns
  frozen_lr: 1.0e-3
  finetune_epochs: 20         # phase 2: the whole network learns
  finetune_lr: 1.0e-4
  scheduler: cosine           # cosine schedule = learning rate slowly lowers to ~0
  log_images_every: 200       # every N batches, save a snapshot of the batch being trained on (TensorBoard)
  mistakes_to_show: 24        # after each epoch, show the most confident wrong validation answers
