# What this does: describes our code as an installable Python package named "symbolcnn".
# Why: after "pip install -e ." every script and test can "import symbolcnn"
# without fiddling with PYTHONPATH, on Windows and Linux alike.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolcnn"
version = "0.1.0"
description = "CNN that classifies hand-drawn symbols: no_symbol / unknown_symbol / triangle (CS471 final project)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
